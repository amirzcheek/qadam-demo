<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081321">
  <meta name="description" content="Интерактивная демонстрация приложения Qadam">
  <title>Qadam — интерактивное демо</title>
  <style>
    :root{color-scheme:dark;--bg:#081321;--panel:#111e30;--line:#1b2c43;--muted:#91a4bc;--text:#f2f6fc;--blue:#11a9e7;--pink:#eb3e9c;--green:#32c99a;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#172943 0,#0b1728 45%,#07101d 100%);color:var(--text);display:grid;place-items:center;padding:28px 14px}
    button{font:inherit;color:inherit;cursor:pointer} .stage{width:min(100%,500px);display:grid;justify-items:center;gap:14px}.intro{text-align:center}.intro h1{margin:0;font-size:20px;letter-spacing:.18em}.intro p{margin:4px 0;color:#a9bad0;font-size:13px}.phone{width:min(100%,410px);height:min(844px,calc(100dvh - 140px));min-height:620px;background:var(--bg);border:1px solid #31425b;border-radius:38px;box-shadow:0 28px 90px #0009;overflow:hidden;position:relative;display:flex;flex-direction:column}.status{height:30px;flex:none;padding:5px 23px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.02em;background:var(--bg)}.signal{color:#d8e2f0}.appbar{height:60px;flex:none;display:flex;align-items:center;padding:0 18px;gap:11px}.crest{width:35px;height:45px;display:block;object-fit:contain;flex:none}.brand{font-size:20px;letter-spacing:.22em;font-weight:800}.push{margin-left:auto;background:none;border:0;font-size:20px;color:#d5e2f2;padding:8px}.scroll{overflow:auto;overscroll-behavior:contain;flex:1;padding:7px 17px 24px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.hello{text-align:center;margin:17px 0 8px}.hello h2{font-size:25px;margin:0}.sub{color:var(--muted);margin:2px 0}.ring{width:min(60vw,234px);height:min(60vw,234px);max-width:234px;max-height:234px;border:9px solid var(--blue);border-radius:50%;margin:18px auto 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 28px #11a9e722}.ring small{color:var(--muted);font-size:13px}.ring strong{font-size:42px;line-height:1.2;margin:3px 0}.ring em{font-style:normal;color:var(--blue);font-size:15px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:8px -10px 19px;text-align:center}.metric{padding:3px 4px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric .ico{height:24px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--blue)}.metric .ico svg{display:block;width:20px;height:20px;margin:0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.metric strong{display:block;font-size:20px;margin:3px 0}.metric span{display:block;color:var(--muted);font-size:10px}.row-title{display:flex;justify-content:space-between;align-items:center;color:var(--blue);font-size:12px;letter-spacing:.13em;font-weight:800;margin:18px 0 10px}.link{border:0;background:none;color:var(--blue);font-size:11px;letter-spacing:.1em}.friends{display:flex;gap:14px;margin-bottom:16px}.friend{min-width:66px;text-align:center;color:var(--muted);font-size:11px}.avatar{width:47px;height:47px;margin:0 auto 5px;border-radius:50%;display:grid;place-items:center;background:#192a40;color:#b5c7dd;font-weight:700;font-size:15px}.avatar.add{border:1px solid var(--blue);background:transparent;color:var(--blue);font-size:27px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile,.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:15px}.tile{min-height:106px;text-align:left;position:relative;overflow:hidden}.tile:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--blue);border-radius:3px}.tile:nth-child(2):before{background:var(--pink)}.tile .tileico{font-size:23px}.tile strong{display:block;margin-top:12px;font-size:15px}.tile small{color:var(--muted)}.nav{flex:none;height:64px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);background:#0b1728;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#657b98;font-size:9px;letter-spacing:.09em;font-weight:700;display:grid;align-content:center;justify-items:center;gap:1px}.nav button b{font-size:19px;font-weight:500}.nav button.active{color:var(--blue)}
    .page-title{font-size:23px;margin:11px 0 3px}.hint{color:var(--muted);font-size:13px;margin:0 0 18px}.card{margin:10px 0}.card h3{margin:0 0 10px;font-size:15px}.line{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #24344a}.line:first-of-type{border:0}.line small{color:var(--muted)}.primary,.secondary{border:0;border-radius:13px;padding:12px 16px;font-weight:750}.primary{background:var(--blue);color:#03121e}.secondary{background:#1a2b41;color:var(--text);border:1px solid #2b405b}.wide{width:100%;margin-top:12px}.selects{display:flex;gap:7px}.pill{border:1px solid #30445e;background:#111e30;color:#c2d0e2;border-radius:999px;padding:7px 11px;font-size:12px}.pill.active{border-color:var(--blue);color:var(--blue)}.rank{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #223149}.rank:last-child{border:0}.rank .avatar{width:34px;height:34px;margin:0;font-size:12px}.rank strong{font-size:13px}.rank small{display:block;color:var(--muted);font-size:11px}.rank em{font-style:normal;font-weight:800;color:var(--blue);font-size:13px}.toast{position:absolute;top:92px;left:18px;right:18px;z-index:3;padding:11px 14px;background:#1b3148;border:1px solid #35516f;border-radius:12px;box-shadow:0 8px 28px #0006;font-size:13px;animation:fade 3s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0;pointer-events:none}}.modal-back{position:absolute;inset:0;z-index:4;background:#0009;display:grid;align-items:end}.modal{background:#101d2e;border:1px solid #263a55;border-radius:24px 24px 0 0;padding:22px 20px 28px;box-shadow:0 -12px 44px #0006}.modal h3{margin:0 0 4px}.modal p{color:var(--muted);font-size:13px}.modal input{width:100%;padding:12px;margin:8px 0;background:#0a1524;border:1px solid #334862;border-radius:11px;color:white;font:inherit}.note{color:#94a7be;font-size:11px;text-align:center;margin:0}.back{border:0;background:none;color:var(--blue);padding:4px 0 8px;font-size:13px}.bar{height:8px;background:#24364e;border-radius:10px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;width:76%;background:var(--blue);border-radius:10px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:112px;padding-top:14px}.day{display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;height:100%;color:var(--muted);font-size:9px}.day i{width:16px;min-height:12px;background:#087bad;border-radius:6px 6px 3px 3px}.day.today i{background:var(--blue)}
    @media(max-height:760px){body{padding:8px}.phone{height:calc(100dvh - 73px);min-height:580px}.intro h1{font-size:17px}.intro p{font-size:11px}}
  </style>
</head>
<body>
  <main class="stage">
    <header class="intro"><h1>QADAM</h1><p>Интерактивное демо · нажимайте на экране</p></header>
    <section class="phone" aria-label="Демонстрация приложения Qadam">
      <div class="status"><span>9:41 ◈</span><span class="signal">● ● ●　 Wi-Fi　 ▰</span></div>
      <header class="appbar"><img class="crest" src="./knus_shield.png" alt="KNUS"><div class="brand">QADAM</div><button class="push" aria-label="Уведомления" data-screen="notifications">♧</button></header>
      <div class="scroll" id="screen" tabindex="0"></div>
      <nav class="nav" aria-label="Разделы">
        <button data-screen="home" class="active"><b>⌂</b>ГЛАВНАЯ</button><button data-screen="friends"><b>♧</b>ДРУЗЬЯ</button><button data-screen="groups"><b>♟</b>ГРУППЫ</button><button data-screen="profile"><b>♙</b>ПРОФИЛЬ</button>
      </nav>
      <div id="overlay"></div>
    </section>
    <p class="note">Демонстрационные данные · датчик шагов и сервер не подключены</p>
  </main>
  <script>
    (()=>{
      const screen=document.querySelector('#screen'),overlay=document.querySelector('#overlay'),nav=[...document.querySelectorAll('.nav button')];
      let current='home',steps=11400,goal=10000,period='Неделя',language='Русский';
      const fmt=n=>n.toLocaleString('ru-RU');
      const friends=[['КН','Кайрат','15 900'],['АС','Айгүл','13 100'],['ДМ','Данияр','12 450']];
      const tabs=(items,selected)=>`<div class="selects">${items.map(x=>`<button class="pill ${x===selected?'active':''}" data-period="${x}">${x}</button>`).join('')}</div>`;
      const row=(a,b)=>`<div class="line"><span>${a}</span><small>${b}</small></div>`;
      function setScreen(id){current=id;render();nav.forEach(b=>b.classList.toggle('active',b.dataset.screen===id));screen.scrollTop=0}
      function render(){
        const views={
          home:()=>`<div class="hello"><h2>Димаш</h2><p class="sub">Ваша активность сегодня</p></div><button class="ring" data-screen="steps"><small>Шаги сегодня</small><strong>${fmt(steps)}</strong><small>${fmt(steps)} / ${fmt(goal)}</small><em>${Math.round(steps/goal*100)}%</em></button><div class="metrics"><div class="metric"><div class="ico">♨</div><strong>570</strong><span>ккал</span></div><div class="metric"><div class="ico"><svg viewBox="0 0 24 24" aria-label="Расстояние"><path d="M6 21s-4-4.2-4-8a4 4 0 1 1 8 0c0 3.8-4 8-4 8Z"/><path d="M18 3s-4 4.2-4 8a4 4 0 1 0 8 0c0-3.8-4-8-4-8Z"/><path d="m8.5 11.5 7-3"/></svg></div><strong>8.2</strong><span>км</span></div><div class="metric"><div class="ico">◷</div><strong>1 ч 54 м</strong><span>активность</span></div><div class="metric"><div class="ico" style="color:var(--pink)">🏆</div><strong>#3</strong><span>Шымкент</span></div></div><div class="row-title"><span>ДРУЗЬЯ · ${friends.length-1}</span><button class="link" data-screen="friends">ПОИСК</button></div><div class="friends"><button class="friend" data-action="addFriend"><span class="avatar add">＋</span>Добавить</button>${friends.slice(0,2).map(f=>`<button class="friend" data-screen="friends"><span class="avatar">${f[0]}</span>${f[1]}<br>${f[2]}</button>`).join('')}</div><div class="tiles"><button class="tile" data-screen="steps"><span class="tileico">🚶</span><strong>Шагомер</strong><small>Прогресс и цель</small></button><button class="tile" data-screen="academy"><span class="tileico">🎓</span><strong>Обучение</strong><small>Курсы академии</small></button><button class="tile" data-screen="leaderboard"><span class="tileico">🏆</span><strong>Рейтинг</strong><small>Город и друзья</small></button><button class="tile" data-screen="groups"><span class="tileico">👥</span><strong>Команды</strong><small>Вместе активнее</small></button></div>`,
          steps:()=>`<button class="back" data-screen="home">← Главная</button><h2 class="page-title">Шагомер</h2><p class="hint">Ваша активность за сегодня</p><div class="card" style="text-align:center"><div class="ring" style="width:190px;height:190px;margin:6px auto 13px"><small>Шаги сегодня</small><strong>${fmt(steps)}</strong><small>из ${fmt(goal)}</small><em>${Math.round(steps/goal*100)}%</em></div><div class="bar"><i style="width:${Math.min(100,steps/goal*100)}%"></i></div><p class="hint">Цель ${fmt(goal)} шагов</p><button class="primary" data-action="goal">Изменить цель</button> <button class="secondary" data-action="walk">＋ 500 шагов</button></div><div class="card"><h3>За неделю</h3><div class="week">${[55,76,45,91,62,100,70].map((h,i)=>`<div class="day ${i===6?'today':''}"><i style="height:${h}%"></i>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</div>`).join('')}</div></div>`,
          leaderboard:()=>`<button class="back" data-screen="home">← Главная</button><h2 class="page-title">Рейтинг города</h2><p class="hint">Шымкент · ${period.toLowerCase()}</p>${tabs(['День','Неделя','Месяц','Сезон'],period)}<div class="card" style="margin-top:15px">${[['1','Нұрлан','22 410'],['2','Айгүл','18 250'],['3','Димаш (вы)',''+fmt(steps)],['4','Кайрат','9 840'],['5','Аружан','8 920']].map((x,i)=>`<div class="rank"><strong>${x[0]}</strong><span><strong>${x[1]}</strong><small>${i===2?'Ваш результат':'Участник клуба'}</small></span><em>${x[2]}</em></div>`).join('')}</div><button class="secondary wide" data-action="toast" data-message="Вы на 3 месте — отличный результат!">Поделиться результатом</button>`,
          friends:()=>`<h2 class="page-title">Друзья</h2><p class="hint">Соревнуйтесь и поддерживайте друг друга</p><button class="secondary wide" data-action="addFriend">＋ Найти друга</button><div class="row-title"><span>АКТИВНОСТЬ СЕГОДНЯ</span><button class="link" data-screen="leaderboard">РЕЙТИНГ</button></div><div class="card">${friends.map((f,i)=>`<div class="rank"><span class="avatar">${f[0]}</span><span><strong>${f[1]}${i===0?' · лидер':''}</strong><small>${i===2?'В сети':'Был(а) сегодня'}</small></span><em>${f[2]}</em></div>`).join('')}</div>`,
          groups:()=>`<h2 class="page-title">Группы</h2><p class="hint">Активность вместе — больше мотивации</p><div class="card"><h3>🏙 Шымкент</h3><p class="hint">Региональная группа · 248 участников</p><button class="secondary wide" data-screen="groupDetail">Открыть рейтинг →</button></div><div class="card"><h3>⚡ KNUS Runners</h3><p class="hint">Ваша команда · 12 участников</p><div style="display:flex;gap:8px"><button class="secondary" data-screen="groupDetail">Рейтинг</button><button class="secondary" data-action="toast" data-message="Код приглашения: QADAM24">Код приглашения</button></div></div><button class="primary wide" data-action="createGroup">＋ Создать группу</button>`,
          groupDetail:()=>`<button class="back" data-screen="groups">← Группы</button><h2 class="page-title">KNUS Runners</h2><p class="hint">Рейтинг команды · ${period.toLowerCase()}</p>${tabs(['День','Неделя','Месяц'],period==='Сезон'?'Месяц':period)}<div class="card" style="margin-top:15px">${[['1','Кайрат','15 900'],['2','Димаш',''+fmt(steps)],['3','Айгүл','13 100'],['4','Мирас','9 840']].map(x=>`<div class="rank"><strong>${x[0]}</strong><span><strong>${x[1]}</strong><small>Участник команды</small></span><em>${x[2]}</em></div>`).join('')}</div><button class="secondary wide" data-action="toast" data-message="Код приглашения скопирован: QADAM24">Пригласить участников</button>`,
          profile:()=>`<h2 class="page-title">Профиль</h2><p class="hint">Настройки и ваши данные</p><div class="card" style="text-align:center"><div class="avatar" style="width:68px;height:68px;font-size:22px">ДМ</div><h3 style="margin:8px 0 0">Димаш М.</h3><p class="hint">@dimash · Шымкент</p><button class="secondary" data-action="toast" data-message="Профиль готов к редактированию">Редактировать профиль</button></div><div class="card"><h3>Язык приложения</h3>${['Русский','Қазақша','English'].map(l=>`<button class="pill ${language===l?'active':''}" data-language="${l}">${l}</button>`).join('')}</div><div class="card">${row('Приватность','Настроить →')}${row('Уведомления','Включены →')}${row('О приложении','Qadam · 1.0')}</div><button class="secondary wide" data-screen="privacy">Настройки приватности</button>`,
          privacy:()=>`<button class="back" data-screen="profile">← Профиль</button><h2 class="page-title">Приватность</h2><p class="hint">Выберите, что видят другие участники</p><div class="card">${['Шаги и активность','Мой профиль','Достижения','Показывать в рейтинге'].map((x,i)=>`<div class="line"><span>${x}</span><button class="pill active" data-action="toggle">${i===1?'Друзья':'Все'}</button></div>`).join('')}</div><button class="primary wide" data-action="toast" data-message="Настройки сохранены">Сохранить</button>`,
          notifications:()=>`<button class="back" data-screen="home">← Главная</button><h2 class="page-title">Уведомления</h2><p class="hint">Последние события</p><div class="card">${row('🏆 Вы поднялись на 3 место','Сегодня, 09:20')}${row('👟 Кайрат обогнал вашу цель','Сегодня, 08:14')}${row('👥 Айгүл пригласила вас в команду','Вчера')}</div>`,
          academy:()=>`<button class="back" data-screen="home">← Главная</button><h2 class="page-title">Академия</h2><p class="hint">Знания для активной жизни</p><div class="card"><h3>🏃 Основы бега</h3><p class="hint">План тренировок для начинающих</p><button class="secondary" data-action="toast" data-message="Курс скоро появится в приложении">Скоро</button></div><div class="card"><h3>🥗 Питание и энергия</h3><p class="hint">Простые привычки каждый день</p><button class="secondary" data-action="toast" data-message="Курс скоро появится в приложении">Скоро</button></div>`,
        };
        screen.innerHTML=(views[current]||views.home)();
      }
      function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;overlay.replaceChildren(el);setTimeout(()=>el.remove(),3100)}
      function modal(title,description,body){overlay.innerHTML=`<div class="modal-back" data-close="true"><section class="modal"><h3>${title}</h3><p>${description}</p>${body}<button class="secondary wide" data-action="close">Отмена</button></section></div>`}
      document.addEventListener('click',e=>{
        const target=e.target.closest('button,[data-close]');if(!target)return;
        if(target.dataset.close){overlay.innerHTML='';return}
        if(target.dataset.screen){setScreen(target.dataset.screen);return}
        if(target.dataset.period){period=target.dataset.period;render();return}
        if(target.dataset.language){language=target.dataset.language;render();toast(`Язык интерфейса: ${language}`);return}
        const action=target.dataset.action;
        if(action==='close'){overlay.innerHTML='';return}
        if(action==='walk'){steps+=500;render();toast('Добавлено 500 демонстрационных шагов');return}
        if(action==='goal'){modal('Дневная цель','Установите свою цель шагов',`<input id="goalInput" type="number" min="1000" max="50000" step="500" value="${goal}" aria-label="Количество шагов"><button class="primary wide" data-action="saveGoal">Сохранить цель</button>`);return}
        if(action==='saveGoal'){const value=Number(document.querySelector('#goalInput')?.value);if(value>=1000&&value<=50000){goal=value;overlay.innerHTML='';render();toast(`Новая цель: ${fmt(goal)} шагов`)}return}
        if(action==='addFriend'){modal('Найти друга','Введите никнейм участника',`<input id="friendInput" placeholder="Например, @aruzhan" aria-label="Никнейм"><button class="primary wide" data-action="searchFriend">Найти</button>`);return}
        if(action==='searchFriend'){const name=document.querySelector('#friendInput')?.value?.trim();overlay.innerHTML='';toast(name?`Найден участник ${name} · приглашение отправлено`:'Введите никнейм для поиска');return}
        if(action==='createGroup'){modal('Новая группа','Создайте команду для друзей',`<input id="groupInput" placeholder="Название группы" aria-label="Название группы"><button class="primary wide" data-action="saveGroup">Создать группу</button>`);return}
        if(action==='saveGroup'){const name=document.querySelector('#groupInput')?.value?.trim();overlay.innerHTML='';toast(name?`Группа «${name}» создана`:'Введите название группы');return}
        if(action==='toggle'){target.classList.toggle('active');target.textContent=target.classList.contains('active')?'Все':'Только я';return}
        if(action==='toast'){toast(target.dataset.message||'Готово')}
      });
      render();
    })();
  </script>
</body>
</html>
